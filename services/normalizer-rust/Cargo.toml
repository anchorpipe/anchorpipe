[package]
name = "anchorpipe-normalizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Deterministic canonical normalization worker for parsed test reports"
license = "Apache-2.0"

[dependencies]
anchorpipe-rust-contracts = { path = "../rust-contracts" }
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"

[dev-dependencies]
