[package]
name = "anchorpipe-canonicalizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Deterministic canonical normalization worker for parsed test reports"
license = "Apache-2.0"

[dependencies]
anchorpipe-pipeline-contracts = { path = "../pipeline-contracts" }
async-trait = "0.1"
lapin = "2.3"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v5"] }
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"

[dev-dependencies]
