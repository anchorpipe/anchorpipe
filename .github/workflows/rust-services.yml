name: Rust services

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/rust-workspace/**'
      - 'services/ingestion-rust/**'
      - 'services/normalizer-rust/**'
      - 'services/rust-contracts/**'
      - '.github/workflows/rust-services.yml'
  pull_request:
    paths:
      - 'services/rust-workspace/**'
      - 'services/ingestion-rust/**'
      - 'services/normalizer-rust/**'
      - 'services/rust-contracts/**'
      - '.github/workflows/rust-services.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rust format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rust-workspace
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          if ! find ../ingestion-rust ../normalizer-rust ../rust-contracts -maxdepth 1 -type f -name Cargo.toml -print -quit 2>/dev/null | grep -q .; then
            echo "No Rust service crate manifests exist yet; format check is deferred."
            exit 0
          fi
          cargo fmt --all -- --check

  check:
    name: Rust cargo check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rust-workspace
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check workspace
        shell: bash
        run: |
          set -euo pipefail
          if ! find ../ingestion-rust ../normalizer-rust ../rust-contracts -maxdepth 1 -type f -name Cargo.toml -print -quit 2>/dev/null | grep -q .; then
            echo "No Rust service crate manifests exist yet; cargo check is deferred."
            exit 0
          fi
          cargo check --workspace

  test:
    name: Rust cargo test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rust-workspace
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test workspace
        shell: bash
        run: |
          set -euo pipefail
          if ! find ../ingestion-rust ../normalizer-rust ../rust-contracts -maxdepth 1 -type f -name Cargo.toml -print -quit 2>/dev/null | grep -q .; then
            echo "No Rust service crate manifests exist yet; cargo test is deferred."
            exit 0
          fi
          cargo test --workspace

  dependency-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rust-workspace
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! find ../ingestion-rust ../normalizer-rust ../rust-contracts -maxdepth 1 -type f -name Cargo.toml -print -quit 2>/dev/null | grep -q .; then
            echo "No Rust service crate manifests exist yet; dependency audit is deferred."
            exit 0
          fi
          if ! command -v cargo-audit >/dev/null 2>&1; then
            echo "cargo-audit is unavailable; attempting a locked install."
            if ! cargo install cargo-audit --locked; then
              echo "::warning::cargo-audit is unavailable, so the dependency audit was skipped."
              exit 0
            fi
          fi
          cargo audit --manifest-path Cargo.toml
