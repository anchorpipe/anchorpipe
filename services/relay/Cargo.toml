[package]
name = "anchorpipe-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Transactional outbox relay draining Postgres outbox events onto the message broker"

[dependencies]
anchorpipe-pipeline-contracts = { path = "../pipeline-contracts" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures-util = "0.3"
lapin = "2.3"
serde_json = "1"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
