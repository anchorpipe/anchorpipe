[package]
name = "anchorpipe-ingestion-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Authenticated, bounded ingestion HTTP worker for Anchorpipe"

[dependencies]
async-trait = "0.1"
anchorpipe-rust-contracts = { path = "../rust-contracts" }
axum = { version = "0.7", features = ["macros"] }
http-body-util = "0.1"
hmac = "0.12"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "signal", "rt-multi-thread"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http = "1"
tower = "0.5"
